name: Build HVAC PRO package verification APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HVAC_PRO_PACKAGE_VERIFICATION_READY.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build signed verification APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract verification source project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="HVAC_PRO_PACKAGE_VERIFICATION_READY.zip"
          test -f "$ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          SETTINGS_FILE=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          test -n "$SETTINGS_FILE"
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify Google package registration challenge file
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="app/src/main/assets/adi-registration.properties"
          test -f "$FILE"
          grep -Fxq 'DPNL3DDLZO4D2AAAAAAAAAAAAA' "$FILE"

      - name: Prepare upload keystore
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/hvacpro-upload.jks"
          chmod 600 "$RUNNER_TEMP/hvacpro-upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/hvacpro-upload.jks" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          HVAC_UPLOAD_STORE_FILE: ${{ runner.temp }}/hvacpro-upload.jks
          HVAC_UPLOAD_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          HVAC_UPLOAD_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          HVAC_UPLOAD_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$HVAC_UPLOAD_KEY_PASSWORD"
          gradle --no-daemon assembleRelease

      - name: Verify release APK signature and challenge asset
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          unzip -l "$APK" | grep -F 'assets/adi-registration.properties'

      - name: Upload signed verification APK
        uses: actions/upload-artifact@v4
        with:
          name: HVAC-PRO-PACKAGE-VERIFICATION-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

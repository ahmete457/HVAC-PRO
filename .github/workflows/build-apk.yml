
name: Build HVAC PRO Android

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find and extract HVAC PRO project
        id: project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 4 -type f \
            -name 'HVAC_PRO*_Android_Project*.zip' \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "HVAC PRO ZIP file not found!"
            exit 1
          fi

          echo "Found project: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Gradle settings file not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check Gradle version
        run: gradle --version

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon assembleDebug

      - name: Build Release AAB
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HVAC-PRO-APK
          path: |
            extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: HVAC-PRO-AAB
          path: |
            extracted/**/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

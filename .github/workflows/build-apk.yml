
name: Build HVAC PRO Android

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build APK and Signed AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find and extract HVAC PRO project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          FOUND=false

          while IFS= read -r ZIP_FILE; do
            echo "Checking: $ZIP_FILE"
            if unzip -Z1 "$ZIP_FILE" | grep -Eq '(^|/)settings\.gradle(\.kts)?$'; then
              echo "Found project: $ZIP_FILE"
              unzip -q "$ZIP_FILE" -d extracted
              FOUND=true
              break
            fi
          done < <(find . -maxdepth 4 -type f -name '*.zip' | sort)

          if [ "$FOUND" != "true" ]; then
            echo "ERROR: Android project ZIP not found!"
            exit 1
          fi

          SETTINGS_FILE=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Gradle settings file missing!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare upload keystore
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "$SIGNING_KEY_BASE64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ]; then
            echo "ERROR: Signing secrets are missing."
            exit 1
          fi

          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/hvacpro-upload.jks"
          chmod 600 "$RUNNER_TEMP/hvacpro-upload.jks"

          keytool -list \
            -keystore "$RUNNER_TEMP/hvacpro-upload.jks" \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" >/dev/null

      - name: Check Gradle version
        run: gradle --version

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon assembleDebug

      - name: Build Signed Release AAB
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          HVAC_UPLOAD_STORE_FILE: ${{ runner.temp }}/hvacpro-upload.jks
          HVAC_UPLOAD_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          HVAC_UPLOAD_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          HVAC_UPLOAD_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease

      - name: Verify APK and AAB
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find . -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)
          AAB=$(find . -type f -path '*/build/outputs/bundle/release/*.aab' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB not found!"
            exit 1
          fi

          jarsigner -verify "$AAB" >/dev/null
          echo "APK found: $APK"
          echo "Signed AAB signature verified: $AAB"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HVAC-PRO-APK
          path: ${{ steps.project.outputs.project_dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: HVAC-PRO-SIGNED-AAB
          path: ${{ steps.project.outputs.project_dir }}/**/build/outputs/bundle/release/*.aab
          if-no-files-found: error

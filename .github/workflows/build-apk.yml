
name: Build HVAC PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract V3 project
        run: |
          unzip -q HVAC_PRO_v3_Android_Project.zip -d extracted

      - name: Find Android project
        run: |
          SETTINGS_FILE=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android project settings file not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Prepare APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "APK file not found!"
            exit 1
          fi

          cp "$APK" HVAC-PRO-APK.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HVAC-PRO-V3-APK
          path: HVAC-PRO-APK.apk
          if-no-files-found: error


name: Build HVAC PRO Android

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find and extract HVAC PRO project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted
          FOUND=false

          while IFS= read -r ZIP_FILE; do
            echo "Checking: $ZIP_FILE"

            if unzip -Z1 "$ZIP_FILE" | grep -Eq '(^|/)settings\.gradle(\.kts)?$'; then
              echo "Found project: $ZIP_FILE"
              unzip -q "$ZIP_FILE" -d extracted
              FOUND=true
              break
            fi
          done < <(find . -maxdepth 4 -type f -name '*.zip' | sort)

          if [ "$FOUND" != "true" ]; then
            echo "ERROR: Android project ZIP not found!"
            find . -maxdepth 4 -type f -name '*.zip'
            exit 1
          fi

          SETTINGS_FILE=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Gradle settings file missing!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check Gradle version
        run: gradle --version

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon assembleDebug

      - name: Build Release AAB
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon bundleRelease

      - name: Verify APK and AAB
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find . -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)
          AAB=$(find . -type f -path '*/build/outputs/bundle/release/*.aab' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          if [ -z "$AAB" ]; then
            echo "ERROR: AAB not found!"
            exit 1
          fi

          echo "APK found: $APK"
          echo "AAB found: $AAB"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HVAC-PRO-APK
          path: ${{ steps.project.outputs.project_dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: HVAC-PRO-AAB
          path: ${{ steps.project.outputs.project_dir }}/**/build/outputs/bundle/release/*.aab
          if-no-files-found: error
